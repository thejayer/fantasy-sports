# Strictly Jayers league registry.
# ESPN credentials (espn_s2 + SWID) are supplied via env at sync time, not here.

leagues:
  - id: baseball-dynasty
    name: Strictly Jayers Baseball
    short_name: Baseball Dynasty
    sport: baseball
    format: dynasty
    platform: espn
    espn_league_id: 2499137
    seasons: [2024, 2025, 2026]
    current_season: 2026
    espn_url: https://fantasy.espn.com/baseball/league?leagueId=2499137

  - id: football-main
    name: Strictly Jayers Football
    short_name: Football Main
    sport: football
    format: redraft
    platform: espn
    espn_league_id: 39790
    # ESPN history available from 2015; site focuses on recent seasons first.
    seasons: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    current_season: 2026
    espn_url: https://fantasy.espn.com/football/league?leagueId=39790

  - id: football-dynasty
    name: Strictly Jayers Football Dynasty
    short_name: Football Dynasty
    sport: football
    format: dynasty
    platform: espn
    espn_league_id: 94266
    seasons: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    current_season: 2026
    espn_url: https://fantasy.espn.com/football/league?leagueId=94266

  # Hub-native golf (roadmap Phase 6) — not ESPN. Seed/fixtures via `sg` / regenerate.
  - id: golf-main
    name: Strictly Jayers Golf
    short_name: Golf Main
    sport: golf
    format: h2h
    platform: hub
    seasons: [2026]
    current_season: 2026
    team_count: 8
    golf:
      bench: 10
      missed_cut_mode: alt1
      draft_style: snake
      keepers: false
      multipliers:
        regular: 1.0
        signature: 1.5
        major: 2.0
