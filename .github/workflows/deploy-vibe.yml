name: deploy vibe

# Deploy Vibe Split to Cloud Run (sj-vibe).
#
# Auth: Workload Identity Federation (same deployer SA as www/hub/fitness).
# Reuses sj-hub Secret Manager values (AUTH_SECRET / Google / ALLOWED_EMAILS)
# plus vibe-only GitHub OAuth + token-key secrets. GCS bucket for
# hub_members.json + per-user vibe JSON. Entrypoint must not mkdir/stat
# the FUSE mount (PORT probe).
#
# After deploy, add this host to the existing Google OAuth client:
#   Authorized JavaScript origin:  https://vibe.strictlyjayers.com
#   Authorized redirect URI:       https://vibe.strictlyjayers.com/api/auth/callback/google
#
# Deploys on merge to main when apps/vibe changes, and on workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - "apps/vibe/**"
      - "apps/vibe/Dockerfile"
      - ".github/workflows/deploy-vibe.yml"
  workflow_dispatch:
    inputs:
      project_id:
        description: "GCP project ID"
        required: true
        default: "fantasy-sports-analytics"
      region:
        description: "Cloud Run region"
        required: true
        default: "us-central1"
      service:
        description: "Cloud Run service name"
        required: true
        default: "sj-vibe"
      bucket:
        description: "GCS bucket RW at /app/data/sj (hub_members + vibe/). Blank on manual = leave mounts; push CD defaults to …-sj-data"
        required: false
        default: ""
      site_url:
        description: "Canonical SITE_URL / AUTH_URL (blank = keep existing custom host, else Cloud Run URL)"
        required: false
        default: ""
      community_site_url:
        description: "Absolute COMMUNITY_SITE_URL"
        required: true
        default: "https://strictlyjayers.com"
      fantasy_hub_url:
        description: "Absolute FANTASY_HUB_URL"
        required: true
        default: "https://fantasy.strictlyjayers.com"
      fitness_url:
        description: "Absolute FITNESS_URL"
        required: true
        default: "https://fitness.strictlyjayers.com"
      min_instances:
        description: "Cloud Run min instances (0=scale-to-zero)"
        required: true
        default: "0"

permissions:
  contents: read
  id-token: write

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1047753647109/locations/global/workloadIdentityPools/github/providers/github
  GCP_SERVICE_ACCOUNT: ffa-deployer@fantasy-sports-analytics.iam.gserviceaccount.com
  GCP_PROJECT_NUMBER: "1047753647109"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: ${{ github.event.inputs.project_id || 'fantasy-sports-analytics' }}
      REGION: ${{ github.event.inputs.region || 'us-central1' }}
      SERVICE: ${{ github.event.inputs.service || 'sj-vibe' }}
      MIN_INSTANCES: ${{ github.event.inputs.min_instances || '0' }}
      SITE_URL_INPUT: ${{ github.event.inputs.site_url || '' }}
      BUCKET: ${{ github.event.inputs.bucket || '' }}
      EVENT_NAME: ${{ github.event_name }}
      DEFAULT_BUCKET: fantasy-sports-analytics-sj-data
      COMMUNITY_SITE_URL: ${{ github.event.inputs.community_site_url || 'https://strictlyjayers.com' }}
      FANTASY_HUB_URL: ${{ github.event.inputs.fantasy_hub_url || 'https://fantasy.strictlyjayers.com' }}
      FITNESS_URL: ${{ github.event.inputs.fitness_url || 'https://fitness.strictlyjayers.com' }}
      PREFERRED_SITE_HOST: vibe.strictlyjayers.com
    steps:
      - name: Validate inputs
        run: |
          for pair in "project_id=$PROJECT_ID" "region=$REGION" "service=$SERVICE"; do
            name=${pair%%=*}
            value=${pair#*=}
            case "$value" in
              ""|*[!A-Za-z0-9_-]*)
                echo "Invalid $name: only letters, digits, '-' and '_' are allowed." >&2
                exit 1 ;;
            esac
          done
          case "$MIN_INSTANCES" in
            ""|*[!0-9]*)
              echo "Invalid min_instances: must be a non-negative integer." >&2
              exit 1 ;;
          esac
          case "$COMMUNITY_SITE_URL" in
            https://*) ;;
            *)
              echo "Invalid community_site_url: must be https://..." >&2
              exit 1 ;;
          esac
          case "$FANTASY_HUB_URL" in
            https://*) ;;
            *)
              echo "Invalid fantasy_hub_url: must be https://..." >&2
              exit 1 ;;
          esac
          case "$FITNESS_URL" in
            https://*) ;;
            *)
              echo "Invalid fitness_url: must be https://..." >&2
              exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            iamcredentials.googleapis.com \
            secretmanager.googleapis.com \
            --project "$PROJECT_ID"

      - name: Ensure Artifact Registry repo
        run: |
          gcloud artifacts repositories describe sj \
            --location "$REGION" --project "$PROJECT_ID" 2>/dev/null \
          || gcloud artifacts repositories create sj \
            --repository-format=docker --location "$REGION" \
            --project "$PROJECT_ID" --description "Strictly Jayers hub images"

      - name: Ensure vibe-only secrets exist
        run: |
          RUNTIME_SA="${GCP_PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          ensure_secret() {
            name="$1"
            if gcloud secrets describe "$name" --project "$PROJECT_ID" >/dev/null 2>&1; then
              echo "secret $name exists"
            else
              echo "creating placeholder secret $name (replace with the real value)"
              openssl rand -hex 32 | gcloud secrets create "$name" \
                --data-file=- --project "$PROJECT_ID"
            fi
            # The deployer SA (ffa-deployer) has no secretmanager.secrets.setIamPolicy,
            # so this binding 403'd and failed every deploy (#201/#207/#208).
            # Best-effort: the runtime SA was granted secretAccessor on the four
            # sj-vibe-* secrets once by an IAM admin, so the deploy works; if not,
            # Cloud Run's deploy step fails with a clear secret-access error.
            if ! gcloud secrets add-iam-policy-binding "$name" \
              --project "$PROJECT_ID" \
              --member="serviceAccount:${RUNTIME_SA}" \
              --role="roles/secretmanager.secretAccessor" \
              --quiet >/dev/null 2>bind.err; then
              echo "::warning title=secret IAM binding skipped::Could not grant roles/secretmanager.secretAccessor on $name to ${RUNTIME_SA} ($(tr '\n' ' ' < bind.err | cut -c1-200)). Expected when the runtime SA already has access (granted once by an IAM admin). Otherwise have an IAM admin add that binding; do not widen ${GCP_SERVICE_ACCOUNT} to secretmanager.admin."
            fi
          }
          ensure_secret sj-vibe-github-client-id
          ensure_secret sj-vibe-github-client-secret
          ensure_secret sj-vibe-token-key
          ensure_secret sj-vibe-cron-secret

      - name: Build and push image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/sj/vibe:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f apps/vibe/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Resolve SITE_URL and deploy
        run: |
          RUN_URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)' 2>/dev/null || true)"
          if [ -z "$RUN_URL" ]; then
            RUN_URL="https://${SERVICE}-${GCP_PROJECT_NUMBER}.${REGION}.run.app"
          fi
          CURRENT_SITE="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='yaml(spec.template.spec.containers[0].env)' 2>/dev/null \
            | awk '/name: SITE_URL/{getline; if ($1=="value:") {print $2; exit}}' \
            || true)"
          if [ -n "$SITE_URL_INPUT" ]; then
            SITE_URL="$SITE_URL_INPUT"
            echo "Using SITE_URL from workflow input"
          elif [ -n "$CURRENT_SITE" ] && [[ "$CURRENT_SITE" != *".run.app"* ]]; then
            SITE_URL="$CURRENT_SITE"
            echo "Keeping existing custom SITE_URL"
          else
            SITE_URL="$RUN_URL"
          fi
          echo "Using SITE_URL=$SITE_URL (Cloud Run URL: $RUN_URL)"

          ARGS=(
            --project "$PROJECT_ID"
            --region "$REGION"
            --image "$IMAGE"
            --platform managed
            --allow-unauthenticated
            --memory 512Mi --cpu 1 --port 8080
            --timeout 60
            --min-instances "$MIN_INSTANCES"
            --max-instances 3
            --cpu-boost
            --update-env-vars "SITE_URL=$SITE_URL,AUTH_URL=$SITE_URL,AUTH_TRUST_HOST=true,SJ_HUB_DIR=/app/data/sj,SJ_VIBE_DIR=/app/data/sj/vibe,COMMUNITY_SITE_URL=$COMMUNITY_SITE_URL,FANTASY_HUB_URL=$FANTASY_HUB_URL,FITNESS_URL=$FITNESS_URL"
            --set-secrets "AUTH_SECRET=sj-auth-secret:latest,AUTH_GOOGLE_ID=sj-auth-google-id:latest,AUTH_GOOGLE_SECRET=sj-auth-google-secret:latest,ALLOWED_EMAILS=sj-allowed-emails:latest,GITHUB_CLIENT_ID=sj-vibe-github-client-id:latest,GITHUB_CLIENT_SECRET=sj-vibe-github-client-secret:latest,SJ_VIBE_TOKEN_KEY=sj-vibe-token-key:latest,CRON_SECRET=sj-vibe-cron-secret:latest"
          )
          if [ -z "$BUCKET" ] && [ "$EVENT_NAME" = "push" ]; then
            BUCKET="$DEFAULT_BUCKET"
            echo "Push CD: defaulting bucket to $BUCKET"
          fi
          if [ -n "$BUCKET" ]; then
            echo "Mounting gs://$BUCKET RW at /app/data/sj (hub_members + vibe/)"
            ARGS+=(
              --clear-volumes
              --clear-volume-mounts
              --add-volume "name=sjdata,type=cloud-storage,bucket=$BUCKET,readonly=false,mount-options=uid=1001;gid=1001"
              --add-volume-mount "volume=sjdata,mount-path=/app/data/sj"
            )
          else
            echo "No bucket input — leaving Cloud Run volumes unchanged"
          fi
          gcloud run deploy "$SERVICE" "${ARGS[@]}"

          LIVE_URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')"
          if [[ "$SITE_URL" == *".run.app"* ]] && [ -n "$LIVE_URL" ] && [ "$LIVE_URL" != "$SITE_URL" ]; then
            echo "Reconciling SITE_URL: $SITE_URL → $LIVE_URL"
            gcloud run services update "$SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --update-env-vars "SITE_URL=$LIVE_URL,AUTH_URL=$LIVE_URL,AUTH_TRUST_HOST=true"
            SITE_URL="$LIVE_URL"
          fi
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "SERVICE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "RUN_URL=$LIVE_URL" >> "$GITHUB_ENV"

      - name: Print the live URL
        run: |
          echo "Deployed vibe to: $SERVICE_URL"
          echo "Cloud Run URL: $RUN_URL"
          echo
          echo "Custom domain (Spaceship): ./scripts/setup-vibe-domain.sh"
          echo "  Preferred host: https://$PREFERRED_SITE_HOST"
          echo
          echo "Add these to the existing Google OAuth client (same as sj-hub):"
          echo "  Authorized JavaScript origin:  $SERVICE_URL"
          echo "  Authorized redirect URI:       $SERVICE_URL/api/auth/callback/google"
          echo
          echo "GitHub OAuth app callback: $SERVICE_URL/api/github/callback"
          if [ -n "$RUN_URL" ] && [ "$RUN_URL" != "$SERVICE_URL" ]; then
            echo "  Also keep origin/redirect for:  $RUN_URL"
          fi
