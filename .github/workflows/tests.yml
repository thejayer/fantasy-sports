name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Matrix over the container Python (3.12) and the floor we still support (3.11).
  # Branch protection requires the check name `python`, which the aggregator
  # job below keeps reporting — matrix jobs alone would rename it to
  # `python (3.11)` / `python (3.12)` and break the required check.
  python-matrix:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Install from the lockfile
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Run pytest
        run: pytest -q

  # Aggregator whose check name stays `python` for branch protection.
  # Job id stays `test` so any older reference to `tests / test` still resolves.
  test:
    name: python
    needs: python-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the matrix to have passed
        run: |
          if [ "${{ needs.python-matrix.result }}" != "success" ]; then
            echo "python-matrix result: ${{ needs.python-matrix.result }}"
            exit 1
          fi

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime in apps/web/Dockerfile.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Reads .next/prerender-manifest.json, so it has to follow the build.
      # Fails if a page that reads league snapshots got statically prerendered,
      # which would serve build-time fixture data forever.
      - name: Assert no content route was prerendered
        run: npm run verify:prerender

      # Phase 5 — catch accidental client-bundle bloat (jsx-a11y already via lint).
      - name: Assert client bundle budgets
        run: npm run verify:bundle-budget

      # Roadmap 7.11 — largest HTML document must stay under 100 KB (fixtures).
      - name: Assert HTML document budgets
        run: npm run verify:html-budget

      # The hub went from 14 advisories to 0; without a gate that silently
      # drifts back. Dependabot (roadmap 1.5) opens PRs when advisories land
      # against an untouched dependency so this stays actionable rather than
      # a surprise on an unrelated change.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # Community portal (apex) — apps/www. Not a branch-protection gate yet.
  www:
    name: www
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/www
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/www/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://strictlyjayers.com
          FANTASY_HUB_URL: https://fantasy.strictlyjayers.com

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # Roadmap 1.2 — Playwright smoke against next start + fixtures.
  # Separate from `web` so Chromium install does not inflate the unit/build job.
  # Not required by branch protection yet; enable once stable on main.
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build hub
        run: npm run build
        env:
          AUTH_DEV_BYPASS: "1"
          AUTH_SECRET: ci-smoke-secret
          AUTH_URL: http://127.0.0.1:3000

      - name: Smoke (AUTH_DEV_BYPASS)
        run: npm run test:e2e
        env:
          AUTH_DEV_BYPASS: "1"
          AUTH_SECRET: ci-smoke-secret
          AUTH_URL: http://127.0.0.1:3000
          CI: "true"

      - name: Auth redirect (no bypass)
        run: npm run test:e2e:auth
        env:
          AUTH_DEV_BYPASS: "0"
          AUTH_SECRET: ci-smoke-secret
          AUTH_URL: http://127.0.0.1:3001
          CI: "true"

  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Building is the only way to catch what a Dockerfile change breaks.
      # Adding non-root users collided with a Debian system account and failed
      # the build outright -- nothing in review would have surfaced that.
      #
      # The ffa dashboard image is deliberately not built here: it runs
      # `ffa ingest` at build time, which needs network access to nflverse and
      # produces a ~1 GB image. Too slow and too flaky for a PR gate.
      - name: Build hub image
        run: docker build -f apps/web/Dockerfile -t sj-hub:ci .

      - name: Build portal image
        run: docker build -f apps/www/Dockerfile -t sj-www:ci .

      - name: Build sync image
        run: docker build -f Dockerfile.sync -t sj-sync:ci .

      - name: Assert images do not run as root
        run: |
          status=0
          for image in sj-hub:ci sj-www:ci sj-sync:ci; do
            uid="$(docker run --rm --entrypoint id "$image" -u)"
            if [ "$uid" = "0" ]; then
              echo "::error::$image runs as root (uid 0)"
              status=1
            else
              echo "$image runs as uid $uid"
            fi
          done
          exit "$status"

      # Phase 5 / AUDIT #17: hub must not ship the ffa analytics stack.
      - name: Assert hub image excludes ffa analytics imports
        run: |
          status=0
          for mod in duckdb sklearn nflreadpy pulp; do
            if docker run --rm --entrypoint python sj-hub:ci -c "import $mod" 2>/dev/null; then
              echo "::error::sj-hub image unexpectedly imports $mod"
              status=1
            else
              echo "sj-hub correctly missing $mod"
            fi
          done
          # sj CLI module must still be importable for optional startup sync.
          if ! docker run --rm --entrypoint python sj-hub:ci -c "import sj.cli"; then
            echo "::error::sj-hub cannot import sj.cli"
            status=1
          fi
          exit "$status"

      # Cloud Run injects HOSTNAME=<instance id>. Entrypoint must force
      # HOSTNAME=0.0.0.0 or Next.js fails getaddrinfo and never listens on 8080.
      - name: Smoke hub listens with Cloud Run-like HOSTNAME
        run: |
          cid="$(docker run -d \
            -e PORT=8080 \
            -e HOSTNAME=sj-hub-ci-fake-instance \
            -e SJ_SYNC_ON_START=0 \
            -e AUTH_URL=https://example.com \
            -p 18080:8080 \
            sj-hub:ci)"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/login || true)"
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "302" ]; then
              echo "hub responded HTTP $code"
              exit 0
            fi
            sleep 1
          done
          echo "::error::hub did not respond on :8080 with Cloud Run-like HOSTNAME"
          docker logs "$cid" || true
          exit 1

      - name: Smoke portal listens with Cloud Run-like HOSTNAME
        run: |
          cid="$(docker run -d \
            -e PORT=8080 \
            -e HOSTNAME=sj-www-ci-fake-instance \
            -e SITE_URL=https://strictlyjayers.com \
            -e FANTASY_HUB_URL=https://fantasy.strictlyjayers.com \
            -p 18081:8080 \
            sj-www:ci)"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/health || true)"
            if [ "$code" = "200" ]; then
              echo "portal health responded HTTP $code"
              exit 0
            fi
            sleep 1
          done
          echo "::error::portal did not respond on :8080 with Cloud Run-like HOSTNAME"
          docker logs "$cid" || true
          exit 1
