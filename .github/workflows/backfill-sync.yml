name: backfill sync

# One-click ESPN history load into gs://…-sj-data via the existing Cloud Run Job.
# Does not rebuild/redeploy the job — deploy sync job first if sj-sync is missing.
#
# Auth: Workload Identity Federation (same pool/provider as deploy-sync-job).
# Project / WIF / deployer SA come from repository secrets (masked).
# Hub only sees the result when deployed with the GCS bucket mounted.

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "GCP project ID (blank = repository secret GCP_PROJECT_ID)"
        required: false
        default: ""
      region:
        description: "Cloud Run region"
        required: true
        default: "us-central1"
      job:
        description: "Cloud Run Job name"
        required: true
        default: "sj-sync"
      mode:
        description: "Command to run on the job"
        required: true
        type: choice
        default: backfill
        options:
          - backfill
          - sync
      wait:
        description: "Wait for the job execution to finish (true/false)"
        required: true
        default: "true"

permissions:
  contents: read
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    # Full registry backfill can take a while (many league-seasons + ESPN).
    timeout-minutes: 90
    env:
      PROJECT_ID: ${{ inputs.project_id || secrets.GCP_PROJECT_ID }}
      REGION: ${{ inputs.region }}
      JOB: ${{ inputs.job }}
      MODE: ${{ inputs.mode }}
      WAIT: ${{ inputs.wait }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA: ${{ secrets.GCP_DEPLOYER_SA }}
    steps:
      - name: Require repository secrets
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${GCP_WIF_PROVIDER}" ]; then
            missing+=(GCP_WIF_PROVIDER)
          fi
          if [ -z "${GCP_DEPLOYER_SA}" ]; then
            missing+=(GCP_DEPLOYER_SA)
          fi
          if [ -z "${PROJECT_ID}" ]; then
            missing+=(GCP_PROJECT_ID)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions before this workflow can run:"
            echo "  GCP_WIF_PROVIDER  — Workload Identity Federation provider resource path"
            echo "  GCP_DEPLOYER_SA   — deployer service-account email"
            echo "  GCP_PROJECT_ID    — GCP project ID (or pass the project_id workflow_dispatch input)"
            exit 1
          fi
          echo "Deploy secrets are present."

      - name: Validate inputs
        run: |
          for pair in "project_id=$PROJECT_ID" "region=$REGION" "job=$JOB"; do
            name=${pair%%=*}
            value=${pair#*=}
            case "$value" in
              ""|*[!A-Za-z0-9_.-]*)
                echo "Invalid $name: only letters, digits, '.', '-' and '_' are allowed." >&2
                exit 1 ;;
            esac
          done
          case "$MODE" in
            backfill|sync) ;;
            *)
              echo "Invalid mode: $MODE (expected backfill or sync)" >&2
              exit 1 ;;
          esac

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Ensure Cloud Run Job exists
        run: |
          if ! gcloud run jobs describe "$JOB" \
            --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
            echo "::error::Cloud Run Job '$JOB' not found in $PROJECT_ID/$REGION."
            echo "Deploy it first: Actions → deploy sync job → Run workflow"
            exit 1
          fi

      - name: Execute job
        id: exec
        run: |
          set -euo pipefail
          if [ "$MODE" = "backfill" ]; then
            ARGS=(--args=backfill)
          else
            # Match Dockerfile.sync scheduled default.
            ARGS=(--args=sync,--current-only)
          fi
          WAIT_ARGS=()
          if [ "$WAIT" = "true" ]; then
            # `gcloud run jobs executions wait` is not a command — use execute --wait.
            WAIT_ARGS+=(--wait)
          fi
          echo "Starting $MODE on job $JOB ${WAIT_ARGS[*]:-}…"
          # Progress chatter is on stderr; keep the last format line as the name.
          EXEC=$(gcloud run jobs execute "$JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            "${ARGS[@]}" \
            "${WAIT_ARGS[@]}" \
            --format='value(metadata.name)' | tail -n1)
          echo "execution=$EXEC" >> "$GITHUB_OUTPUT"
          echo "Execution: $EXEC"
          if [ "$WAIT" = "true" ]; then
            SUCCEEDED=$(gcloud run jobs executions describe "$EXEC" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --format='value(status.succeededCount)')
            if [ "${SUCCEEDED:-0}" != "1" ]; then
              echo "::error::Job execution $EXEC did not succeed (succeededCount=$SUCCEEDED)"
              gcloud run jobs executions describe "$EXEC" \
                --project "$PROJECT_ID" --region "$REGION"
              exit 1
            fi
            echo "Execution succeeded."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Sync job execution"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Job | \`$JOB\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Region | \`$REGION\` |"
            echo "| Project | \`$PROJECT_ID\` |"
            echo "| Waited | \`$WAIT\` |"
            echo "| Execution | \`${{ steps.exec.outputs.execution }}\` |"
            echo
            echo "Snapshots land in the hub store bucket (repository secret GCS_BUCKET)."
            echo "Hub only sees them when deployed with that bucket mounted"
            echo "(Actions → **deploy hub** → set **bucket**, or rely on push CD)."
            echo
            echo "Logs:"
            echo "\`\`\`"
            echo "gcloud run jobs executions describe ${{ steps.exec.outputs.execution }} \\"
            echo "  --project $PROJECT_ID --region $REGION"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
