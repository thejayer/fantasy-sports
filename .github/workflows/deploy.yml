name: deploy dashboard

# Manual deploy of the Streamlit dashboard to Google Cloud Run.
#
# One-time setup (see DEPLOY.md):
#   - a GCP project with billing enabled
#   - WIF + deployer SA: ./scripts/setup-github-deployer.sh
#   - the shared league password in Secret Manager as `ffa-dashboard-password`
#     (./scripts/create-hub-secrets.sh, then add-hub-secret-version.sh)
#
# The password is bound with --set-secrets rather than --set-env-vars so it is
# not readable from the Cloud Run service config.
#
# Then run this workflow from the Actions tab, filling in the project id.

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "GCP project ID"
        required: true
        default: "fantasy-sports-analytics"
      region:
        description: "Cloud Run region"
        required: true
        default: "us-central1"
      service:
        description: "Cloud Run service name"
        required: true
        default: "ffa-dashboard"
      ingest_seasons:
        description: "Seasons to bake into the image (space-separated)"
        required: true
        default: "2023 2024 2025"
      dashboard_season:
        description: "Season the dashboard projects"
        required: true
        default: "2026"

permissions:
  contents: read
  id-token: write

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1047753647109/locations/global/workloadIdentityPools/github/providers/github
  GCP_SERVICE_ACCOUNT: ffa-deployer@fantasy-sports-analytics.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Inputs/secrets go through env vars, not ${{ }} interpolation directly in
    # shell, so a crafted input can't inject commands into the run blocks.
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      SERVICE: ${{ inputs.service }}
      INGEST_SEASONS: ${{ inputs.ingest_seasons }}
      DASHBOARD_SEASON: ${{ inputs.dashboard_season }}
      PASSWORD_SECRET: ffa-dashboard-password
    steps:
      - name: Validate inputs
        run: |
          # project_id / region / service are interpolated into shell and,
          # for project_id/region, written to $GITHUB_ENV via IMAGE. Restrict
          # them to an allowlist so a crafted value can't inject env vars or
          # shell metacharacters. GCP ids, regions, and Cloud Run service
          # names all fit [A-Za-z0-9_-].
          for pair in "project_id=$PROJECT_ID" "region=$REGION" "service=$SERVICE"; do
            name=${pair%%=*}
            value=${pair#*=}
            case "$value" in
              ""|*[!A-Za-z0-9_-]*)
                echo "Invalid $name: only letters, digits, '-' and '_' are allowed." >&2
                exit 1 ;;
            esac
          done

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.googleapis.com artifactregistry.googleapis.com \
            --project "$PROJECT_ID"

      - name: Ensure Artifact Registry repo
        run: |
          gcloud artifacts repositories describe ffa \
            --location "$REGION" --project "$PROJECT_ID" 2>/dev/null \
          || gcloud artifacts repositories create ffa \
            --repository-format=docker --location "$REGION" \
            --project "$PROJECT_ID" --description "ffa dashboard images"

      - name: Build and push image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/ffa/dashboard:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg INGEST_SEASONS="$INGEST_SEASONS" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Require the dashboard password secret
        run: |
          # The password comes from Secret Manager, not a workflow env var, so
          # it is never visible in the Cloud Run service config. Fail early with
          # a fixable message rather than deploying an unprotected dashboard.
          if ! gcloud secrets describe "$PASSWORD_SECRET" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "Missing Secret Manager secret '$PASSWORD_SECRET' in $PROJECT_ID." >&2
            echo "Create and populate it first:" >&2
            echo "  ./scripts/create-hub-secrets.sh" >&2
            echo "  ./scripts/add-hub-secret-version.sh $PASSWORD_SECRET" >&2
            echo "  ./scripts/grant-hub-secret-access.sh" >&2
            exit 1
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi --cpu 1 --port 8080 \
            --set-secrets "DASHBOARD_PASSWORD=$PASSWORD_SECRET:latest" \
            --set-env-vars "DASHBOARD_SEASON=$DASHBOARD_SEASON,DASHBOARD_LEAGUE=ppr"

      - name: Print the live URL
        run: |
          echo "Deployed to:"
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.url)'
