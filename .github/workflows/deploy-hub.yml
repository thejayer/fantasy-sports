name: deploy hub

# Deploy the Strictly Jayers Next.js hub to Cloud Run.
#
# Auth: Workload Identity Federation (no JSON key). Pool/provider + SA binding
# are one-time GCP setup — see scripts/setup-github-deployer.sh and HUB.md.
#
# Also needed:
#   - Secret Manager secrets populated (scripts/create-hub-secrets.sh + add versions)
#   - Runtime SA can read them (scripts/grant-hub-secret-access.sh)
#   - Snapshot bucket + scheduled sync job (scripts/setup-sync-infra.sh)
#
# Deploys on merge to main (branch protection is the CI gate) and on manual
# workflow_dispatch (rollback / first-time). After the first deploy, add the
# printed URL to the Google OAuth client's authorized origins + redirect URIs.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "src/sj/**"
      - "fixtures/sj/**"
      - "configs/**"
      - "requirements-lock.txt"
      - "apps/web/Dockerfile"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch:
    inputs:
      project_id:
        description: "GCP project ID"
        required: true
        default: "fantasy-sports-analytics"
      region:
        description: "Cloud Run region"
        required: true
        default: "us-central1"
      service:
        description: "Cloud Run service name"
        required: true
        default: "sj-hub"
      bucket:
        description: "Snapshot bucket to mount (blank to serve baked fixtures)"
        required: false
        default: "fantasy-sports-analytics-sj-data"

permissions:
  contents: read
  id-token: write

env:
  # WIF — pool `github`, provider `github`, SA `ffa-deployer`.
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1047753647109/locations/global/workloadIdentityPools/github/providers/github
  GCP_SERVICE_ACCOUNT: ffa-deployer@fantasy-sports-analytics.iam.gserviceaccount.com
  # Used only for first-create AUTH_URL fallback (avoids gcloud projects.describe /
  # Cloud Resource Manager API on the deployer SA).
  GCP_PROJECT_NUMBER: "1047753647109"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT_ID: ${{ github.event.inputs.project_id || 'fantasy-sports-analytics' }}
      REGION: ${{ github.event.inputs.region || 'us-central1' }}
      SERVICE: ${{ github.event.inputs.service || 'sj-hub' }}
      BUCKET: ${{ github.event.inputs.bucket || 'fantasy-sports-analytics-sj-data' }}
    steps:
      - name: Validate inputs
        run: |
          for pair in "project_id=$PROJECT_ID" "region=$REGION" "service=$SERVICE"; do
            name=${pair%%=*}
            value=${pair#*=}
            case "$value" in
              ""|*[!A-Za-z0-9_-]*)
                echo "Invalid $name: only letters, digits, '-' and '_' are allowed." >&2
                exit 1 ;;
            esac
          done
          case "$BUCKET" in
            ""|*[!A-Za-z0-9_.-]*)
              if [ -n "$BUCKET" ]; then
                echo "Invalid bucket name: $BUCKET" >&2
                exit 1
              fi ;;
          esac

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            iamcredentials.googleapis.com \
            --project "$PROJECT_ID"

      - name: Ensure Artifact Registry repo
        run: |
          gcloud artifacts repositories describe sj \
            --location "$REGION" --project "$PROJECT_ID" 2>/dev/null \
          || gcloud artifacts repositories create sj \
            --repository-format=docker --location "$REGION" \
            --project "$PROJECT_ID" --description "Strictly Jayers hub images"

      - name: Build and push image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/sj/hub:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f apps/web/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Resolve AUTH_URL and deploy
        run: |
          # Prefer the existing public URL so redeploys are one gcloud call.
          # First-time create: regional run.app form from GCP_PROJECT_NUMBER
          # (do not call gcloud projects.describe — needs Resource Manager API).
          # Reconcile if Cloud Run returns a different status.url.
          AUTH_URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)' 2>/dev/null || true)"
          if [ -z "$AUTH_URL" ]; then
            AUTH_URL="https://${SERVICE}-${GCP_PROJECT_NUMBER}.${REGION}.run.app"
          fi
          echo "Using AUTH_URL=$AUTH_URL"

          ARGS=(
            --project "$PROJECT_ID"
            --region "$REGION"
            --image "$IMAGE"
            --platform managed
            --allow-unauthenticated
            --memory 1Gi --cpu 1 --port 8080
            --timeout 300
            --set-env-vars "SJ_SYNC_ON_START=0,AUTH_TRUST_HOST=true,SJ_DATA_DIR=/app/data/sj,AUTH_URL=$AUTH_URL"
            --set-secrets "AUTH_SECRET=sj-auth-secret:latest,AUTH_GOOGLE_ID=sj-auth-google-id:latest,AUTH_GOOGLE_SECRET=sj-auth-google-secret:latest,ALLOWED_EMAILS=sj-allowed-emails:latest"
          )
          if [ -n "$BUCKET" ]; then
            # Sync job owns writes; hub mounts read-only. uid/gid must match the
            # non-root sjhub user (1001) or FUSE perms can block store reads.
            ARGS+=(
              --add-volume "name=sjdata,type=cloud-storage,bucket=$BUCKET,readonly=true,mount-options=uid=1001,gid=1001"
              --add-volume-mount "volume=sjdata,mount-path=/app/data/sj"
            )
          else
            ARGS+=(--clear-volumes)
          fi
          gcloud run deploy "$SERVICE" "${ARGS[@]}"

          LIVE_URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')"
          if [ "$LIVE_URL" != "$AUTH_URL" ]; then
            echo "Reconciling AUTH_URL: $AUTH_URL → $LIVE_URL"
            gcloud run services update "$SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --update-env-vars "AUTH_URL=$LIVE_URL,AUTH_TRUST_HOST=true"
            AUTH_URL="$LIVE_URL"
          fi
          echo "AUTH_URL=$AUTH_URL" >> "$GITHUB_ENV"
          echo "SERVICE_URL=$AUTH_URL" >> "$GITHUB_ENV"

      - name: Print the live URL
        run: |
          echo "Deployed to: $SERVICE_URL"
          echo
          echo "Add these to the Google OAuth client (APIs & Services → Credentials):"
          echo "  Authorized JavaScript origin:  $SERVICE_URL"
          echo "  Authorized redirect URI:       $SERVICE_URL/api/auth/callback/google"
          # Cloud Run also exposes a *.us-central1.run.app form; add both if Google
          # shows redirect_uri_mismatch.
          ALT="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.address.url)' 2>/dev/null || true)"
          if [ -n "$ALT" ] && [ "$ALT" != "$SERVICE_URL" ]; then
            echo "  Also add origin/redirect for:   $ALT"
          fi
