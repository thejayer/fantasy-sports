name: nightly refresh

# Pull weekly stats from nflverse, export hub-consumable projection snapshots
# (roadmap 4.2) and ESPN↔nflverse player maps (roadmap 4.3) under store/, upload
# artifacts, and promote JSON into the live GCS hub store (Phase 5).
#
# draft-sim is its own job so projections / weekly / player-map still upload
# (and promote) when the Monte Carlo runs long or fails. Keep --sims 300;
# the draft-sim job timeout covers the 31–44+ minute runs.
#
# Promote authenticates with repository secrets (masked in logs), not plaintext
# workflow env. Missing secrets fail the check-secrets job immediately with
# the names to add under Settings → Secrets and variables → Actions.
# The deployer SA still needs objectUser on the hub store bucket
# (see scripts/setup-github-deployer.sh). Hub consumes the mount only when
# deploy-hub is run with bucket set.

on:
  schedule:
    # 11:00 UTC ≈ 07:00 ET, Tue–Sat during NFL season only (Sept–Jan).
    # Manual workflow_dispatch still works year-round for backfills.
    - cron: "0 11 * 9-12 2-6"
    - cron: "0 11 * 1 2-6"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to refresh"
        required: true
        default: "2026"
      lookback:
        description: "Lookback seasons"
        required: true
        default: "3"
      samples:
        description: "Monte Carlo samples per export"
        required: true
        default: "1000"
      promote:
        description: "Promote JSON to GCS hub store (true/false)"
        required: true
        default: "true"
      bucket:
        description: "GCS hub store bucket (blank = repository secret GCS_BUCKET)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  config:
    name: resolve inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      season: ${{ steps.cfg.outputs.season }}
      lookback: ${{ steps.cfg.outputs.lookback }}
      samples: ${{ steps.cfg.outputs.samples }}
    steps:
      - name: Compute season and lookback
        id: cfg
        env:
          SEASON_IN: ${{ github.event.inputs.season }}
          LOOKBACK_IN: ${{ github.event.inputs.lookback }}
          SAMPLES_IN: ${{ github.event.inputs.samples }}
        run: |
          set -euo pipefail
          SEASON="${SEASON_IN}"
          LOOKBACK="${LOOKBACK_IN}"
          SAMPLES="${SAMPLES_IN}"
          if [ -z "$SEASON" ]; then
            SEASON="$(date -u +%Y)"
          fi
          if [ -z "$LOOKBACK" ]; then
            LOOKBACK="3"
          fi
          if [ -z "$SAMPLES" ]; then
            SAMPLES="1000"
          fi
          case "$SEASON" in
            ''|*[!0-9]*)
              echo "Invalid season: $SEASON" >&2
              exit 1 ;;
          esac
          case "$LOOKBACK" in
            ''|*[!0-9]*)
              echo "Invalid lookback: $LOOKBACK" >&2
              exit 1 ;;
          esac
          case "$SAMPLES" in
            ''|*[!0-9]*)
              echo "Invalid samples: $SAMPLES" >&2
              exit 1 ;;
          esac
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "lookback=$LOOKBACK" >> "$GITHUB_OUTPUT"
          echo "samples=$SAMPLES" >> "$GITHUB_OUTPUT"

  check-secrets:
    name: check promote secrets
    if: ${{ github.event_name == 'schedule' || github.event.inputs.promote == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA: ${{ secrets.GCP_DEPLOYER_SA }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      DISPATCH_BUCKET: ${{ github.event.inputs.bucket }}
    steps:
      - name: Require repository secrets
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${GCP_WIF_PROVIDER}" ]; then
            missing+=(GCP_WIF_PROVIDER)
          fi
          if [ -z "${GCP_DEPLOYER_SA}" ]; then
            missing+=(GCP_DEPLOYER_SA)
          fi
          BUCKET="${DISPATCH_BUCKET:-${GCS_BUCKET}}"
          if [ -z "$BUCKET" ]; then
            missing+=(GCS_BUCKET)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions before this workflow can promote:"
            echo "  GCP_WIF_PROVIDER  — Workload Identity Federation provider resource path"
            echo "  GCP_DEPLOYER_SA   — deployer service-account email"
            echo "  GCS_BUCKET        — hub store bucket (or pass the bucket workflow_dispatch input)"
            exit 1
          fi
          echo "Promote secrets are present."

  refresh:
    name: export snapshots
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEASON: ${{ needs.config.outputs.season }}
      LOOKBACK: ${{ needs.config.outputs.lookback }}
      SAMPLES: ${{ needs.config.outputs.samples }}
    outputs:
      artifact: ffa-store-${{ needs.config.outputs.season }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Install from the lockfile
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Ingest weekly stats
        run: |
          set -euo pipefail
          START=$((SEASON - LOOKBACK))
          ARGS=()
          for s in $(seq "$START" "$SEASON"); do
            ARGS+=(--season "$s")
          done
          echo "Ingesting seasons: ${ARGS[*]}"
          ffa ingest "${ARGS[@]}"

      - name: Export projection snapshots
        run: |
          set -euo pipefail
          mkdir -p store/projections
          for LEAGUE in configs/ppr.yaml configs/standard.yaml; do
            ffa export-projections \
              --league "$LEAGUE" \
              --season "$SEASON" \
              --lookback "$LOOKBACK" \
              --samples "$SAMPLES" \
              --out-dir store/projections \
              --format both \
              --conditioned-level
          done
          find store/projections -type f | sort

      - name: Export weekly projection snapshots
        run: |
          set -euo pipefail
          mkdir -p store/weekly_projections
          for LEAGUE in configs/ppr.yaml configs/standard.yaml; do
            ffa export-weekly-projections \
              --league "$LEAGUE" \
              --season "$SEASON" \
              --lookback "$LOOKBACK" \
              --samples "$SAMPLES" \
              --out-dir store/weekly_projections \
              --conditioned-level
          done
          find store/weekly_projections -type f | sort

      - name: Export playoff-odds snapshots
        run: |
          set -euo pipefail
          mkdir -p store/playoff_odds
          # Live sj snapshots only — never export/promote odds from committed
          # fixtures (audit Batch A). Hub offline still reads fixtures/sj/playoff_odds/.
          if [ ! -d data/sj ] || [ ! -f data/sj/index.json ]; then
            echo "No live data/sj — skipping playoff-odds export (fixture fallback is hub-only)."
            exit 0
          fi
          for HUB_SEASON in "$SEASON" "$((SEASON + 1))"; do
            echo "Playoff odds for hub season $HUB_SEASON (sj-root=data/sj)"
            ffa export-playoff-odds \
              --sj-root data/sj \
              --season "$HUB_SEASON" \
              --league configs/ppr.yaml \
              --lookback "$LOOKBACK" \
              --samples "$SAMPLES" \
              --sims 300 \
              --out-dir store/playoff_odds \
              --conditioned-level
          done
          find store/playoff_odds -type f | sort
          # Live sj was present — fail closed if the exporter wrote nothing.
          if ! compgen -G "store/playoff_odds/*/*.json" > /dev/null; then
            echo "::error::Live data/sj present but export-playoff-odds wrote no JSON under store/playoff_odds/"
            exit 1
          fi
          echo "live" > store/playoff_odds/.from_live_sj

      - name: Export ESPN↔nflverse player map
        run: |
          set -euo pipefail
          mkdir -p store/player_map
          # Coverage uses football rosters under data/sj when present; nightly
          # ingest alone still writes the full crosswalk for hub promote.
          if [ -d data/sj ] && [ -f data/sj/index.json ]; then
            SJ_ROOT=data/sj
          else
            SJ_ROOT=fixtures/sj
          fi
          ffa export-player-map \
            --season "$SEASON" \
            --out-dir store/player_map \
            --raw-dir data/raw \
            --sj-root "$SJ_ROOT" \
            --ff-playerids
          find store/player_map -type f | sort
          python - <<'PY'
          import json, pathlib
          paths = sorted(pathlib.Path("store/player_map").glob("*.json"))
          for path in paths:
              doc = json.loads(path.read_text())
              cov = doc.get("coverage") or {}
              rate = cov.get("rate")
              rate_s = f"{rate:.1%}" if isinstance(rate, float) else "n/a"
              print(
                  f"{path}: mappings={doc['stats']['mappings']} "
                  f"hub={cov.get('resolved')}/{cov.get('rostered')} ({rate_s})"
              )
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffa-store-${{ needs.config.outputs.season }}-${{ github.run_id }}
          path: store
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  draft-sim:
    name: export draft-sim
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEASON: ${{ needs.config.outputs.season }}
      LOOKBACK: ${{ needs.config.outputs.lookback }}
      SAMPLES: ${{ needs.config.outputs.samples }}
    outputs:
      artifact: ffa-draft-sim-${{ needs.config.outputs.season }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Install from the lockfile
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Ingest weekly stats
        run: |
          set -euo pipefail
          START=$((SEASON - LOOKBACK))
          ARGS=()
          for s in $(seq "$START" "$SEASON"); do
            ARGS+=(--season "$s")
          done
          echo "Ingesting seasons: ${ARGS[*]}"
          ffa ingest "${ARGS[@]}"

      - name: Export draft-sim snapshots
        run: |
          set -euo pipefail
          mkdir -p store/draft_sim
          # All slots × modest sims — hub Draft tab switches slot offline.
          for LEAGUE in configs/ppr.yaml configs/standard.yaml; do
            ffa export-draft-sim \
              --league "$LEAGUE" \
              --season "$SEASON" \
              --lookback "$LOOKBACK" \
              --samples "$SAMPLES" \
              --sims 300 \
              --slots all \
              --out-dir store/draft_sim \
              --conditioned-level
          done
          find store/draft_sim -type f | sort

      - name: Upload draft-sim artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffa-draft-sim-${{ needs.config.outputs.season }}-${{ github.run_id }}
          path: store
          if-no-files-found: error
          retention-days: 14

  promote:
    name: promote to GCS
    needs: [check-secrets, refresh, draft-sim]
    if: ${{ always() && needs.check-secrets.result == 'success' && needs.refresh.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA: ${{ secrets.GCP_DEPLOYER_SA }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      DISPATCH_BUCKET: ${{ github.event.inputs.bucket }}
    steps:
      - name: Require repository secrets
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${GCP_WIF_PROVIDER}" ]; then
            missing+=(GCP_WIF_PROVIDER)
          fi
          if [ -z "${GCP_DEPLOYER_SA}" ]; then
            missing+=(GCP_DEPLOYER_SA)
          fi
          BUCKET="${DISPATCH_BUCKET:-${GCS_BUCKET}}"
          if [ -z "$BUCKET" ]; then
            missing+=(GCS_BUCKET)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions before this workflow can promote:"
            echo "  GCP_WIF_PROVIDER  — Workload Identity Federation provider resource path"
            echo "  GCP_DEPLOYER_SA   — deployer service-account email"
            echo "  GCS_BUCKET        — hub store bucket (or pass the bucket workflow_dispatch input)"
            exit 1
          fi
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Download export artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.refresh.outputs.artifact }}
          path: artifact

      - name: Download draft-sim artifacts
        if: ${{ needs.draft-sim.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.draft-sim.outputs.artifact }}
          path: artifact

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Promote JSON into hub store
        run: |
          set -euo pipefail
          case "$BUCKET" in
            ""|*[!A-Za-z0-9_.-]*)
              echo "Invalid bucket: $BUCKET" >&2
              exit 1 ;;
          esac
          echo "Promoting season artifacts → gs://${BUCKET}/ (JSON only)"
          find artifact -type f | sort
          # upload-artifact preserves workspace-relative paths (store/…).
          ROOT=artifact/store
          if [ ! -d "$ROOT/projections" ] && [ -d artifact/projections ]; then
            ROOT=artifact
          fi
          shopt -s nullglob
          PPR=( "$ROOT"/projections/ppr/*.json )
          STD=( "$ROOT"/projections/standard/*.json )
          MAP=( "$ROOT"/player_map/*.json )
          DRAFT_PPR=( "$ROOT"/draft_sim/ppr/*/*.json )
          DRAFT_STD=( "$ROOT"/draft_sim/standard/*/*.json )
          WEEKLY_PPR=( "$ROOT"/weekly_projections/ppr/*.json )
          WEEKLY_STD=( "$ROOT"/weekly_projections/standard/*.json )
          PLAYOFF=( "$ROOT"/playoff_odds/*/*.json )
          if [ "${#PPR[@]}" -eq 0 ] && [ "${#STD[@]}" -eq 0 ] && [ "${#MAP[@]}" -eq 0 ] && [ "${#DRAFT_PPR[@]}" -eq 0 ] && [ "${#DRAFT_STD[@]}" -eq 0 ] && [ "${#WEEKLY_PPR[@]}" -eq 0 ] && [ "${#WEEKLY_STD[@]}" -eq 0 ] && [ "${#PLAYOFF[@]}" -eq 0 ]; then
            echo "::error::No JSON files found under $ROOT to promote"
            find artifact -type f | sort
            exit 1
          fi
          if [ "${#PPR[@]}" -gt 0 ]; then
            gcloud storage cp "${PPR[@]}" "gs://${BUCKET}/projections/ppr/"
          fi
          if [ "${#STD[@]}" -gt 0 ]; then
            gcloud storage cp "${STD[@]}" "gs://${BUCKET}/projections/standard/"
          fi
          if [ "${#MAP[@]}" -gt 0 ]; then
            gcloud storage cp "${MAP[@]}" "gs://${BUCKET}/player_map/"
          fi
          if [ "${#DRAFT_PPR[@]}" -gt 0 ]; then
            for f in "${DRAFT_PPR[@]}"; do
              season="$(basename "$(dirname "$f")")"
              gcloud storage cp "$f" "gs://${BUCKET}/draft_sim/ppr/${season}/"
            done
          fi
          if [ "${#DRAFT_STD[@]}" -gt 0 ]; then
            for f in "${DRAFT_STD[@]}"; do
              season="$(basename "$(dirname "$f")")"
              gcloud storage cp "$f" "gs://${BUCKET}/draft_sim/standard/${season}/"
            done
          fi
          if [ "${#WEEKLY_PPR[@]}" -gt 0 ]; then
            gcloud storage cp "${WEEKLY_PPR[@]}" "gs://${BUCKET}/weekly_projections/ppr/"
          fi
          if [ "${#WEEKLY_STD[@]}" -gt 0 ]; then
            gcloud storage cp "${WEEKLY_STD[@]}" "gs://${BUCKET}/weekly_projections/standard/"
          fi
          # Only promote playoff odds produced from live data/sj (Batch A).
          if [ -f "$ROOT/playoff_odds/.from_live_sj" ] && [ "${#PLAYOFF[@]}" -gt 0 ]; then
            for f in "${PLAYOFF[@]}"; do
              lid="$(basename "$(dirname "$f")")"
              gcloud storage cp "$f" "gs://${BUCKET}/playoff_odds/${lid}/"
            done
          elif [ "${#PLAYOFF[@]}" -gt 0 ]; then
            echo "Skipping playoff_odds promote — missing .from_live_sj marker"
          fi
          echo "Promoted OK"
