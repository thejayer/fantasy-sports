name: nightly refresh

# Pull weekly stats from nflverse, export hub-consumable projection snapshots
# (roadmap 4.2) and ESPN↔nflverse player maps (roadmap 4.3) under store/, upload
# artifacts, and promote JSON into the live GCS hub store (Phase 5).
#
# Promote requires ffa-deployer objectUser on gs://fantasy-sports-analytics-sj-data
# (see scripts/setup-github-deployer.sh). Hub consumes the mount only when
# deploy-hub is run with bucket set.

on:
  schedule:
    # 11:00 UTC ≈ 07:00 ET, Tue–Sat during NFL season only (Sept–Jan).
    # Manual workflow_dispatch still works year-round for backfills.
    - cron: "0 11 * 9-12 2-6"
    - cron: "0 11 * 1 2-6"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to refresh"
        required: true
        default: "2025"
      lookback:
        description: "Lookback seasons"
        required: true
        default: "3"
      samples:
        description: "Monte Carlo samples per export"
        required: true
        default: "1000"
      promote:
        description: "Promote JSON to GCS hub store (true/false)"
        required: true
        default: "true"
      bucket:
        description: "GCS hub store bucket"
        required: true
        default: "fantasy-sports-analytics-sj-data"

permissions:
  contents: read
  id-token: write

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1047753647109/locations/global/workloadIdentityPools/github/providers/github
  GCP_SERVICE_ACCOUNT: ffa-deployer@fantasy-sports-analytics.iam.gserviceaccount.com

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      season: ${{ steps.cfg.outputs.season }}
      artifact: ffa-store-${{ steps.cfg.outputs.season }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Compute season and lookback
        id: cfg
        run: |
          SEASON="${{ github.event.inputs.season }}"
          LOOKBACK="${{ github.event.inputs.lookback }}"
          SAMPLES="${{ github.event.inputs.samples }}"
          if [ -z "$SEASON" ]; then
            SEASON="$(date -u +%Y)"
          fi
          if [ -z "$LOOKBACK" ]; then
            LOOKBACK="3"
          fi
          if [ -z "$SAMPLES" ]; then
            SAMPLES="1000"
          fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "lookback=$LOOKBACK" >> "$GITHUB_OUTPUT"
          echo "samples=$SAMPLES" >> "$GITHUB_OUTPUT"

      - name: Ingest weekly stats
        run: |
          SEASON=${{ steps.cfg.outputs.season }}
          LOOKBACK=${{ steps.cfg.outputs.lookback }}
          START=$((SEASON - LOOKBACK))
          ARGS=""
          for s in $(seq $START $SEASON); do
            ARGS="$ARGS --season $s"
          done
          echo "Ingesting seasons: $ARGS"
          ffa ingest $ARGS

      - name: Export projection snapshots
        run: |
          mkdir -p store/projections
          for LEAGUE in configs/ppr.yaml configs/standard.yaml; do
            ffa export-projections \
              --league "$LEAGUE" \
              --season ${{ steps.cfg.outputs.season }} \
              --lookback ${{ steps.cfg.outputs.lookback }} \
              --samples ${{ steps.cfg.outputs.samples }} \
              --out-dir store/projections \
              --format both \
              --conditioned-level
          done
          find store/projections -type f | sort

      - name: Export ESPN↔nflverse player map
        run: |
          mkdir -p store/player_map
          # Coverage uses football rosters under data/sj when present; nightly
          # ingest alone still writes the full crosswalk for hub promote.
          SJ_ROOT=""
          if [ -d data/sj ] && [ -f data/sj/index.json ]; then
            SJ_ROOT="--sj-root data/sj"
          else
            SJ_ROOT="--sj-root fixtures/sj"
          fi
          ffa export-player-map \
            --season ${{ steps.cfg.outputs.season }} \
            --out-dir store/player_map \
            --raw-dir data/raw \
            $SJ_ROOT \
            --ff-playerids
          find store/player_map -type f | sort
          python - <<'PY'
          import json, pathlib
          paths = sorted(pathlib.Path("store/player_map").glob("*.json"))
          for path in paths:
              doc = json.loads(path.read_text())
              cov = doc.get("coverage") or {}
              rate = cov.get("rate")
              rate_s = f"{rate:.1%}" if isinstance(rate, float) else "n/a"
              print(
                  f"{path}: mappings={doc['stats']['mappings']} "
                  f"hub={cov.get('resolved')}/{cov.get('rostered')} ({rate_s})"
              )
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffa-store-${{ steps.cfg.outputs.season }}-${{ github.run_id }}
          path: |
            store/projections/
            store/player_map/
          retention-days: 14

  promote:
    name: promote to GCS
    needs: refresh
    if: ${{ github.event_name == 'schedule' || github.event.inputs.promote == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: ${{ github.event.inputs.bucket || 'fantasy-sports-analytics-sj-data' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.refresh.outputs.artifact }}
          path: artifact

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Promote JSON into hub store
        run: |
          set -euo pipefail
          case "$BUCKET" in
            ""|*[!A-Za-z0-9_.-]*)
              echo "Invalid bucket: $BUCKET" >&2
              exit 1 ;;
          esac
          echo "Promoting season artifacts → gs://${BUCKET}/ (JSON only)"
          find artifact -type f | sort
          # upload-artifact preserves workspace-relative paths (store/…).
          ROOT=artifact/store
          if [ ! -d "$ROOT/projections" ] && [ -d artifact/projections ]; then
            ROOT=artifact
          fi
          shopt -s nullglob
          PPR=( "$ROOT"/projections/ppr/*.json )
          STD=( "$ROOT"/projections/standard/*.json )
          MAP=( "$ROOT"/player_map/*.json )
          if [ "${#PPR[@]}" -eq 0 ] && [ "${#STD[@]}" -eq 0 ] && [ "${#MAP[@]}" -eq 0 ]; then
            echo "::error::No JSON files found under $ROOT to promote"
            find artifact -type f | sort
            exit 1
          fi
          if [ "${#PPR[@]}" -gt 0 ]; then
            gcloud storage cp "${PPR[@]}" "gs://${BUCKET}/projections/ppr/"
          fi
          if [ "${#STD[@]}" -gt 0 ]; then
            gcloud storage cp "${STD[@]}" "gs://${BUCKET}/projections/standard/"
          fi
          if [ "${#MAP[@]}" -gt 0 ]; then
            gcloud storage cp "${MAP[@]}" "gs://${BUCKET}/player_map/"
          fi
          echo "Promoted OK"
