name: nightly refresh

# Pull weekly stats from nflverse, export hub-consumable projection snapshots
# (roadmap 4.2) under store/projections/{scoring}/{season}.json, and upload
# them as build artifacts. Runs every weekday during NFL season (Sept-Jan).
# Can also be triggered manually from the Actions tab.
#
# Artifacts are not auto-committed into data/sj — promote into the hub store
# (or GCS mount) as part of deploy/sync. The hub reads the same path layout
# via getProjectionSnapshot.

on:
  schedule:
    # 11:00 UTC = ~07:00 ET, after the previous day's stats land.
    - cron: "0 11 * * 2-6"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to refresh"
        required: true
        default: "2025"
      lookback:
        description: "Lookback seasons"
        required: true
        default: "3"
      samples:
        description: "Monte Carlo samples per export"
        required: true
        default: "1000"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Compute season and lookback
        id: cfg
        run: |
          SEASON="${{ github.event.inputs.season }}"
          LOOKBACK="${{ github.event.inputs.lookback }}"
          SAMPLES="${{ github.event.inputs.samples }}"
          if [ -z "$SEASON" ]; then
            SEASON="$(date -u +%Y)"
          fi
          if [ -z "$LOOKBACK" ]; then
            LOOKBACK="3"
          fi
          if [ -z "$SAMPLES" ]; then
            SAMPLES="1000"
          fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "lookback=$LOOKBACK" >> "$GITHUB_OUTPUT"
          echo "samples=$SAMPLES" >> "$GITHUB_OUTPUT"

      - name: Ingest weekly stats
        run: |
          SEASON=${{ steps.cfg.outputs.season }}
          LOOKBACK=${{ steps.cfg.outputs.lookback }}
          START=$((SEASON - LOOKBACK))
          ARGS=""
          for s in $(seq $START $SEASON); do
            ARGS="$ARGS --season $s"
          done
          echo "Ingesting seasons: $ARGS"
          ffa ingest $ARGS

      - name: Export projection snapshots
        run: |
          mkdir -p store/projections
          for LEAGUE in configs/ppr.yaml configs/standard.yaml; do
            ffa export-projections \
              --league "$LEAGUE" \
              --season ${{ steps.cfg.outputs.season }} \
              --lookback ${{ steps.cfg.outputs.lookback }} \
              --samples ${{ steps.cfg.outputs.samples }} \
              --out-dir store/projections \
              --format both \
              --conditioned-level
          done
          find store/projections -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: projections-${{ steps.cfg.outputs.season }}-${{ github.run_id }}
          path: store/projections/
          retention-days: 14
