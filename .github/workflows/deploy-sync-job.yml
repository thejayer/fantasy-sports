name: deploy sync job

# Build and deploy the Strictly Jayers ESPN sync as a Cloud Run Job.
#
# Auth: Workload Identity Federation (see scripts/setup-github-deployer.sh).
# One-time infra: scripts/setup-sync-infra.sh (bucket, IAM, Cloud Scheduler).
#
# Cloud Scheduler triggers this job on a cadence; one-click history load:
#   Actions → backfill sync → Run workflow (mode=backfill)
# Or from a laptop:
#   gcloud run jobs execute sj-sync --args=backfill --region=us-central1

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "GCP project ID"
        required: true
        default: "fantasy-sports-analytics"
      region:
        description: "Cloud Run region"
        required: true
        default: "us-central1"
      job:
        description: "Cloud Run Job name"
        required: true
        default: "sj-sync"
      bucket:
        description: "Cloud Storage bucket for snapshots"
        required: true
        default: "fantasy-sports-analytics-sj-data"
      run_after_deploy:
        description: "Execute the job once after deploying (true/false)"
        required: true
        default: "true"
      rankings_provider:
        description: "Optional SJ_RANKINGS_PROVIDER override (blank keeps the live job value)"
        required: false
        default: ""
      rankings_model:
        description: "Optional SJ_RANKINGS_MODEL override (blank keeps the live job value)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1047753647109/locations/global/workloadIdentityPools/github/providers/github
  GCP_SERVICE_ACCOUNT: ffa-deployer@fantasy-sports-analytics.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      JOB: ${{ inputs.job }}
      BUCKET: ${{ inputs.bucket }}
      RUN_AFTER: ${{ inputs.run_after_deploy }}
      RANKINGS_PROVIDER: ${{ inputs.rankings_provider }}
      RANKINGS_MODEL: ${{ inputs.rankings_model }}
    steps:
      - name: Validate inputs
        run: |
          for pair in "project_id=$PROJECT_ID" "region=$REGION" "job=$JOB" "bucket=$BUCKET"; do
            name=${pair%%=*}
            value=${pair#*=}
            case "$value" in
              ""|*[!A-Za-z0-9_.-]*)
                echo "Invalid $name: only letters, digits, '.', '-' and '_' are allowed." >&2
                exit 1 ;;
            esac
          done
          for pair in "rankings_provider=$RANKINGS_PROVIDER" "rankings_model=$RANKINGS_MODEL"; do
            name=${pair%%=*}
            value=${pair#*=}
            [ -z "$value" ] && continue
            case "$value" in
              *[!A-Za-z0-9_.-]*)
                echo "Invalid $name: only letters, digits, '.', '-' and '_' are allowed." >&2
                exit 1 ;;
            esac
          done

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            cloudscheduler.googleapis.com \
            storage.googleapis.com \
            iamcredentials.googleapis.com \
            --project "$PROJECT_ID"

      - name: Ensure Artifact Registry repo
        run: |
          gcloud artifacts repositories describe sj \
            --location "$REGION" --project "$PROJECT_ID" 2>/dev/null \
          || gcloud artifacts repositories create sj \
            --repository-format=docker --location "$REGION" \
            --project "$PROJECT_ID" --description "Strictly Jayers images"

      - name: Build and push sync image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/sj/sync:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f Dockerfile.sync -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run Job
        run: |
          SECRETS="ESPN_S2=sj-espn-s2:latest,ESPN_SWID=sj-espn-swid:latest"
          # Job SA (or the project compute SA on first create). Grant
          # secretAccessor *before* --set-secrets so a new rankings secret
          # cannot take down the daily ESPN sync.
          SYNC_SA="$(gcloud run jobs describe "$JOB" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)"
          if [ -z "$SYNC_SA" ]; then
            PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
            SYNC_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          attach_rankings_secret() {
            local env_name="$1"
            local secret_name="$2"
            if ! gcloud secrets describe "$secret_name" --project "$PROJECT_ID" >/dev/null 2>&1; then
              echo "$secret_name missing — not attaching $env_name"
              return 0
            fi
            gcloud secrets add-iam-policy-binding "$secret_name" \
              --project "$PROJECT_ID" \
              --member="serviceAccount:${SYNC_SA}" \
              --role="roles/secretmanager.secretAccessor" \
              --quiet >/dev/null || true
            local payload
            if ! payload="$(gcloud secrets versions access latest --secret="$secret_name" --project "$PROJECT_ID")"; then
              echo "failed to read $secret_name — aborting so --set-secrets cannot drop an attached key" >&2
              exit 1
            fi
            if [ -z "$payload" ] || [ "$payload" = "REPLACE_ME" ]; then
              echo "$secret_name latest is empty or REPLACE_ME — not attaching $env_name"
              return 0
            fi
            SECRETS="$SECRETS,$env_name=$secret_name:latest"
          }
          attach_rankings_secret SJ_CFBD_API_KEY sj-cfbd-api-key
          attach_rankings_secret SJ_RANKINGS_API_KEY sj-rankings-api-key
          # --update-env-vars merges. Do not --set-env-vars the rankings
          # provider/model: production is openai/gpt-4.1-mini until an xAI
          # key exists, and a default of xai/grok-4-fast would reset that.
          RANKINGS_ENV="SJ_GCS_BUCKET=$BUCKET"
          if [ -n "$RANKINGS_PROVIDER" ]; then
            RANKINGS_ENV="$RANKINGS_ENV,SJ_RANKINGS_PROVIDER=$RANKINGS_PROVIDER"
          fi
          if [ -n "$RANKINGS_MODEL" ]; then
            RANKINGS_ENV="$RANKINGS_ENV,SJ_RANKINGS_MODEL=$RANKINGS_MODEL"
          fi
          COMMON=(
            --project "$PROJECT_ID"
            --region "$REGION"
            --image "$IMAGE"
            --max-retries 2
            --task-timeout 60m
            --memory 1Gi --cpu 1
            --set-secrets "$SECRETS"
          )
          if gcloud run jobs describe "$JOB" --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$JOB" "${COMMON[@]}" --update-env-vars "$RANKINGS_ENV"
          else
            gcloud run jobs create "$JOB" "${COMMON[@]}" --set-env-vars "$RANKINGS_ENV"
          fi

          # P.11 bet tracker — same image, no ESPN cookies. Prefers
          # sj-bets-reader when that SA exists (Austin shares the sheet
          # with that email); otherwise the default compute SA.
          BETS_JOB="sj-bets"
          BETS_SA="sj-bets-reader@${PROJECT_ID}.iam.gserviceaccount.com"
          BETS_ARGS=(
            --project "$PROJECT_ID"
            --region "$REGION"
            --image "$IMAGE"
            --max-retries 2
            --task-timeout 10m
            --memory 512Mi --cpu 1
            --args=bets
            --set-env-vars "SJ_GCS_BUCKET=$BUCKET,SJ_BETS_SHEET_ID=1_F9HCU7uOPH5uo8cgXkxwKrvREolPid_ZoviVVcX3HU"
          )
          if gcloud iam service-accounts describe "$BETS_SA" --project "$PROJECT_ID" >/dev/null 2>&1; then
            BETS_ARGS+=(--service-account "$BETS_SA")
            echo "sj-bets will run as $BETS_SA"
          else
            echo "sj-bets-reader SA missing — sj-bets uses the job default SA"
            echo "Create it with ./scripts/setup-bets-infra.sh"
          fi
          if gcloud run jobs describe "$BETS_JOB" --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$BETS_JOB" "${BETS_ARGS[@]}"
          else
            gcloud run jobs create "$BETS_JOB" "${BETS_ARGS[@]}"
          fi

      - name: Run once after deploy
        if: ${{ inputs.run_after_deploy == 'true' }}
        run: |
          gcloud run jobs execute "$JOB" \
            --project "$PROJECT_ID" --region "$REGION" --wait

      - name: Summary
        run: |
          echo "Job:    $JOB"
          echo "Bucket: gs://$BUCKET"
          echo
          echo "Backfill every season (one-time, slower):"
          echo "  gcloud run jobs execute $JOB --args=backfill --region=$REGION --project=$PROJECT_ID"
          echo
          echo "Bet tracker (after the sheet is shared with the job SA):"
          echo "  gcloud run jobs execute sj-bets --region=$REGION --project=$PROJECT_ID"
          echo "  ./scripts/setup-bets-infra.sh"
          echo
          echo "AI rankings (after sj-cfbd-api-key / sj-rankings-api-key exist):"
          echo "  gcloud run jobs execute $JOB --args=ai-rankings,--board,cfb --region=$REGION --project=$PROJECT_ID"
          echo "  gcloud run jobs execute $JOB --args=ai-rankings,--board,fantasy --region=$REGION --project=$PROJECT_ID"
          echo "  gcloud run jobs execute $JOB --args=ai-rankings,--board,cfb,--force --region=$REGION --project=$PROJECT_ID"
          echo "  Job task-timeout is 60m (Grok CFB prompt). LLM timeout SJ_RANKINGS_TIMEOUT_S=600."
          echo "  ./scripts/setup-sync-infra.sh   # registers Sunday/Monday schedulers"
