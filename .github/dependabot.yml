# Keep npm, pip, and Actions current so advisory cleanup stays automated
# (roadmap 1.5). Weekly cadence; Dependabot opens PRs that still have to pass
# the required `python` / `web` / `images` checks before merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # After Dependabot bumps a pin in pyproject.toml or requirements-lock.txt,
    # regenerate the lockfile if needed:
    #   uv pip compile pyproject.toml --extra dev --extra dashboard --extra gcs \
    #     --python-version 3.12 -o requirements-lock.txt

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
